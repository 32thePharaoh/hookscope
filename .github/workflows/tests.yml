name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    # `composer setup` runs `artisan migrate --force` against .env.example, which
    # sets DB_CONNECTION=mysql. These values match it exactly (127.0.0.1:3306,
    # database hookscope, user root, password hookscope) so setup runs unmodified.
    #
    # Pest uses the same server but a separate schema, hookscope_testing, created
    # by the step below. RefreshDatabase truncates whatever it points at, so
    # sharing the development database would wipe seeded demo data every run.
    # Keep this image tag in sync with compose.yaml. SQLite is deliberately not
    # used: it cannot verify the binary-body handling the longblob schema exists
    # to protect.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: hookscope
          MYSQL_DATABASE: hookscope
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, xml, curl, zip, bcmath, intl
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Create test database
        run: >-
          php -r "(new PDO('mysql:host=127.0.0.1;port=3306', 'root',
          'hookscope'))->exec('CREATE DATABASE IF NOT EXISTS hookscope_testing');"

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check
