server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;
    server_tokens off;
    charset utf-8;

    client_max_body_size 1m;

    error_page 413 = @payload_too_large;

    location @payload_too_large {
        default_type application/json;
        return 413 '{"message":"Payload too large"}';
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ^~ /in/ {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param PHP_VALUE "enable_post_data_reading=off";
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Variable + resolver so nginx starts before reverb exists. Do not proxy /apps.
    location /app {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $reverb_upstream http://reverb:8080;
        proxy_pass $reverb_upstream;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
