# Local development overlay. NOT auto-loaded: the file is named compose.dev.yaml
# rather than compose.override.yaml on purpose, so that a bare `docker compose up`
# runs the production-shaped stack from compose.yaml and works on a fresh clone.
#
# The override bind-mounts the checkout over /var/www/html, which on a fresh clone
# would shadow the image's vendor/ and node_modules/ with empty host directories
# and break the container before FPM starts. Opting in explicitly keeps that
# failure mode away from anyone who just cloned the repo:
#
#   docker compose -f compose.yaml -f compose.dev.yaml up -d --wait
services:
    app:
        build:
            context: .
            target: development
        environment:
            APP_ENV: local
            APP_DEBUG: 'true'
        volumes:
            - .:/var/www/html

    nginx:
        volumes:
            - ./public:/var/www/html/public
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    mysql:
        # Published on loopback only. Root has no password, so binding 0.0.0.0 would
        # expose it to everything on the local network.
        ports:
            - '127.0.0.1:3306:3306'
        volumes:
            - mysql-data:/var/lib/mysql
            - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro

    redis:
        # Loopback only: no password is set on this Redis.
        ports:
            - '127.0.0.1:6379:6379'

    vite:
        build:
            context: .
            target: development
        working_dir: /var/www/html
        volumes:
            - .:/var/www/html
        ports:
            - '127.0.0.1:5173:5173'
        environment:
            APP_ENV: local
        command: ['sh', '-c', 'npm install && npm run dev']
